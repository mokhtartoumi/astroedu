<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASTROVERSE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#05060f;--panel:rgba(255,255,255,.05);--line:rgba(160,150,255,.2);--tx:#e8eaff;--mu:#9aa0c8;--ac:#8b7cff;--ac2:#3ab0ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05060f;--tx:#e8eaff}}
:root[data-theme="dark"]{--bg:#05060f;--tx:#e8eaff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(ellipse at 20% 0,#1a1450 0,var(--bg) 55%) var(--bg);color:var(--tx);font-family:Inter,system-ui,Segoe UI,Tahoma,Arial,sans-serif;line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}
nav{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:14px 5vw;position:sticky;top:env(safe-area-inset-top,0px);backdrop-filter:blur(12px);background:rgba(5,6,15,.7);z-index:5;border-bottom:1px solid var(--line)}
.logo{font-weight:700;letter-spacing:.3em;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent}
.lk{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.lk a{color:var(--mu);font-size:.9rem}.lk a:hover{color:var(--tx)}
.lb{background:none;border:1px solid var(--line);color:var(--mu);padding:3px 9px;border-radius:8px;cursor:pointer}.lb.on{background:var(--ac);color:#fff;border-color:var(--ac)}
section{padding:36px 5vw;max-width:1200px;margin:auto}
h1{font-size:clamp(2rem,6vw,3.8rem);margin:0 0 8px;line-height:1.1}h2{font-weight:600;margin:0 0 18px}h3{margin:6px 0}
.sub{color:var(--mu)}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center}
@media(max-width:800px){.hero{grid-template-columns:1fr}}
canvas{width:100%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#0e0b2e,transparent 70%)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;backdrop-filter:blur(8px);transition:.25s}
a.card:hover{transform:translateY(-4px);border-color:var(--ac);box-shadow:0 0 28px rgba(139,124,255,.25)}
.card img{width:100%;border-radius:10px;margin-bottom:8px}
.ic{font-size:1.8rem}.big{font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums}
.lbl{color:var(--mu);font-size:.75rem;text-transform:uppercase;letter-spacing:.12em}
.cd{display:flex;gap:12px}.cd div{text-align:center}.cd .big{display:block}
button,input,textarea,select{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;max-width:100%}
.pb{cursor:pointer;background:linear-gradient(90deg,var(--ac),var(--ac2));border:0;color:#fff;margin:3px}
.dg{background:#7a1f3a}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs .pb{opacity:.6}.tabs .pb.on{opacity:1}
.adm input,.adm textarea,.adm select{margin:3px 3px 3px 0;width:100%}
.adm .g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px}
.adm{border-top:3px solid var(--ac)}.adm .card{margin-bottom:14px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:2px 12px;font-size:.8rem;color:var(--mu)}
iframe{width:100%;height:70vh;border:1px solid var(--line);border-radius:14px;background:#000}
.pre{white-space:pre-line}
.v3{position:relative;width:100%;height:60vh;min-height:320px;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:14px 0;touch-action:none}.v3 canvas{width:100%!important;height:100%!important;aspect-ratio:auto;border-radius:0;background:none;display:block}.v3 canvas.mc{width:260px!important;height:260px!important;margin:10px auto}.pn{position:absolute;top:10px;inset-inline-start:10px;background:rgba(5,6,15,.85);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.85rem}
footer{text-align:center;color:var(--mu);padding:36px;font-size:.8rem}
</style>
</head>
<body>
<div id="app"></div>
<script id="state" type="application/json">{}</script>
<script>
const U={en:{home:"Home",events:"Events",lab:"Astronomy Lab",admin:"Admin",clock:"Live astronomy clock",explore:"Explore the Universe",upcoming:"Upcoming events",moon:"Moon phase",rise:"Sunrise",set:"Sunset",next:"Next event",days:"Days",hrs:"Hrs",min:"Min",sec:"Sec",illum:"illuminated",none:"None scheduled",back:"Back",login:"Log in",logout:"Log out",pass:"Password",wrong:"Wrong password",site:"Site",cats:"Categories",evs:"Events",labs:"Lab projects",loc:"Location",add:"Add",del:"Delete",imp:"Import JSON",reset:"Reset everything (click twice)",desc:"Description",url:"Project URL (https)",open:"Open in new tab",empty:"Nothing here yet.",note:"Changes are saved to the server automatically.",lt:"Title",ls:"Subtitle",show:"Show on homepage",accent:"Accent color",cover:"Cover image",all:"All events",nolab:"No projects published yet.",bad:"Invalid or missing URL.",date:"Date",cat:"Category",uni:"3D Universe",mph:"Moon simulator",srch:"Search…",favs:"Favorites",pgs:"Pages",dia:"Diameter",dst:"Distance from Sun",per:"Orbital period",yr:"years",dy:"days",pub:"Publish to everyone",pubok:"Only the owner can publish.",foot:"Footer text",logo:"Logo text",no3:"None",sol:"Solar system",mon:"Moon",res:"results",drag:"Drag to rotate · scroll to zoom · tap a planet",today:"Today"},
fr:{home:"Accueil",events:"Événements",lab:"Labo d’astronomie",admin:"Admin",clock:"Horloge astronomique en direct",explore:"Explorer l’Univers",upcoming:"Événements à venir",moon:"Phase de la Lune",rise:"Lever du soleil",set:"Coucher du soleil",next:"Prochain événement",days:"Jours",hrs:"H",min:"Min",sec:"Sec",illum:"illuminée",none:"Aucun prévu",back:"Retour",login:"Connexion",logout:"Déconnexion",pass:"Mot de passe",wrong:"Mot de passe incorrect",site:"Site",cats:"Catégories",evs:"Événements",labs:"Projets du labo",loc:"Position",add:"Ajouter",del:"Supprimer",imp:"Importer JSON",reset:"Tout réinitialiser (cliquer 2 fois)",desc:"Description",url:"URL du projet (https)",open:"Ouvrir dans un nouvel onglet",empty:"Rien pour le moment.",note:"Les modifications sont enregistrées automatiquement sur le serveur.",lt:"Titre",ls:"Sous-titre",show:"Afficher sur l’accueil",accent:"Couleur d’accent",cover:"Image de couverture",all:"Tous les événements",nolab:"Aucun projet publié.",bad:"URL invalide ou manquante.",date:"Date",cat:"Catégorie",uni:"Univers 3D",mph:"Simulateur lunaire",srch:"Rechercher…",favs:"Favoris",pgs:"Pages",dia:"Diamètre",dst:"Distance au Soleil",per:"Période orbitale",yr:"ans",dy:"jours",pub:"Publier pour tous",pubok:"Réservé au propriétaire.",foot:"Texte du pied de page",logo:"Texte du logo",no3:"Aucune",sol:"Système solaire",mon:"Lune",res:"résultats",drag:"Glisser pour tourner · molette pour zoomer · toucher une planète",today:"Aujourd’hui"},
ar:{home:"الرئيسية",events:"الأحداث",lab:"مختبر الفلك",admin:"الإدارة",clock:"الساعة الفلكية المباشرة",explore:"استكشف الكون",upcoming:"الأحداث القادمة",moon:"طور القمر",rise:"شروق الشمس",set:"غروب الشمس",next:"الحدث القادم",days:"أيام",hrs:"ساعة",min:"دقيقة",sec:"ثانية",illum:"مضاءة",none:"لا يوجد حدث",back:"رجوع",login:"دخول",logout:"خروج",pass:"كلمة المرور",wrong:"كلمة المرور خاطئة",site:"الموقع",cats:"الأقسام",evs:"الأحداث",labs:"مشاريع المختبر",loc:"الموقع الجغرافي",add:"إضافة",del:"حذف",imp:"استيراد JSON",reset:"إعادة ضبط الكل (اضغط مرتين)",desc:"الوصف",url:"رابط المشروع (https)",open:"فتح في تبويب جديد",empty:"لا يوجد شيء بعد.",note:"تُحفظ التعديلات تلقائياً على الخادم.",lt:"العنوان",ls:"العنوان الفرعي",show:"إظهار في الرئيسية",accent:"لون التمييز",cover:"صورة الغلاف",all:"كل الأحداث",nolab:"لا توجد مشاريع منشورة.",bad:"رابط غير صالح.",date:"التاريخ",cat:"القسم",uni:"الكون ثلاثي الأبعاد",mph:"محاكي القمر",srch:"بحث…",favs:"المفضلة",pgs:"الصفحات",dia:"القطر",dst:"البعد عن الشمس",per:"مدة المدار",yr:"سنة",dy:"يوم",pub:"نشر للجميع",pubok:"للمالك فقط.",foot:"نص التذييل",logo:"نص الشعار",no3:"بدون",sol:"النظام الشمسي",mon:"القمر",res:"نتيجة",drag:"اسحب للتدوير · العجلة للتكبير · اضغط على كوكب",today:"اليوم"}};
const MN={en:["New Moon","Waxing Crescent","First Quarter","Waxing Gibbous","Full Moon","Waning Gibbous","Last Quarter","Waning Crescent"],fr:["Nouvelle lune","Premier croissant","Premier quartier","Gibbeuse croissante","Pleine lune","Gibbeuse décroissante","Dernier quartier","Dernier croissant"],ar:["محاق","هلال متزايد","التربيع الأول","أحدب متزايد","بدر","أحدب متناقص","التربيع الأخير","هلال متناقص"]};
const ME=["🌑","🌒","🌓","🌔","🌕","🌖","🌗","🌘"];
const mk=(id,ic,ar,en,fr)=>({id,icon:ic,show:true,t:{ar,en,fr},d:{ar:"اكتشف: "+ar,en:"Discover: "+en,fr:"Découvrez : "+fr}});
const DEF=()=>({lang:"en",site:{accent:"#8b7cff",title:{en:"Explore the Universe",fr:"Explorez l’Univers",ar:"استكشف الكون"},sub:{en:"Real-time sky data, events and interactive astronomy.",fr:"Données du ciel en temps réel, événements et astronomie interactive.",ar:"بيانات السماء لحظة بلحظة، أحداث وفلك تفاعلي."}},
loc:{lat:36.8,lng:10.18,name:"Tunis"},
cats:[mk("solar","☀️","النظام الشمسي","Solar System","Système solaire"),mk("planets","🪐","الكواكب","Planets","Planètes"),mk("stars","⭐","النجوم","Stars","Étoiles"),mk("galaxies","🌌","المجرات","Galaxies","Galaxies"),mk("blackholes","⚫","الثقوب السوداء","Black Holes","Trous noirs"),mk("nebulae","☁️","السدم","Nebulae","Nébuleuses"),mk("space","🚀","استكشاف الفضاء","Space Exploration","Exploration spatiale"),mk("meteors","☄️","زخات الشهب","Meteor Showers","Pluies de météores"),mk("eclipses","🌑","الكسوف والخسوف","Eclipses","Éclipses"),mk("cosmos","🔭","علم الكون","Cosmology","Cosmologie")],
ev:[{id:"leonids",cat:"meteors",d:"2026-11-17T00:00",t:{en:"Leonid meteor shower (peak)",fr:"Pluie des Léonides (maximum)",ar:"زخة الأسديات (الذروة)"},x:{en:"Meteors from comet Tempel-Tuttle, best seen after midnight.",fr:"Météores de la comète Tempel-Tuttle, à observer après minuit.",ar:"شهب من المذنب تمبل-تتل، تُرصد بعد منتصف الليل."}},
{id:"geminids",cat:"meteors",d:"2026-12-14T00:00",t:{en:"Geminid meteor shower (peak)",fr:"Pluie des Géminides (maximum)",ar:"زخة التوأميات (الذروة)"},x:{en:"One of the strongest annual showers.",fr:"L’une des pluies annuelles les plus intenses.",ar:"من أقوى الزخات السنوية."}},
{id:"eclipse2027",cat:"eclipses",d:"2027-08-02T10:00",t:{en:"Total solar eclipse (North Africa)",fr:"Éclipse solaire totale (Afrique du Nord)",ar:"كسوف شمسي كلي (شمال أفريقيا)"},x:{en:"Totality crosses North Africa. Check the exact path for your location.",fr:"La totalité traverse l’Afrique du Nord. Vérifiez le tracé exact pour votre position.",ar:"يمر الكسوف الكلي بشمال أفريقيا. تحقق من المسار الدقيق لموقعك."}}],
lab:[],pages:[]});
let S=DEF(),TOKEN="",svT;try{S.lang=localStorage.getItem("av2l")||S.lang;TOKEN=sessionStorage.getItem("avt")||""}catch(e){}
const save=()=>{if(!TOKEN)return;clearTimeout(svT);svT=setTimeout(async()=>{try{const r=await fetch("/api/state",{method:"PUT",headers:{"Content-Type":"application/json",Authorization:"Bearer "+TOKEN},body:JSON.stringify(S)});if(r.status==401){auth=false;TOKEN="";render();alert("Session expired")}else if(!r.ok)alert("Save failed "+r.status)}catch(x){alert("Save failed")}},400)};
const $=id=>document.getElementById(id),p2=n=>String(n).padStart(2,"0");
const e=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const u=k=>(U[S.lang]||U.en)[k]||k,tr=o=>o&&(o[S.lang]||o.en||o.fr||o.ar)||"";
const get=p=>p.split(".").reduce((o,k)=>o&&o[k],S);
const set=(p,v)=>{const a=p.split("."),l=a.pop();a.reduce((o,k)=>o[k]||(o[k]={}),S)[l]=v};
const fd=d=>new Date(d).toLocaleDateString(S.lang,{dateStyle:"long"});
let auth=!!TOKEN,tab="site",armed=false,msg="";

function moonInfo(t){const a=((((t/864e5+2440587.5)-2451550.1)/29.530588853)%1+1)%1,i=Math.floor(a*8+.5)%8;return{n:MN[S.lang][i],e:ME[i],ill:Math.round((1-Math.cos(a*2*Math.PI))/2*100)}}
function sun(lat,lng,dt){const r=Math.PI/180,y=dt.getFullYear(),b=Date.UTC(y,dt.getMonth(),dt.getDate()),n=Math.floor((b-Date.UTC(y,0,0))/864e5),B=r*360/365*(n-81),dec=23.44*r*Math.sin(B),eot=9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B),c=(Math.cos(r*90.833)-Math.sin(lat*r)*Math.sin(dec))/(Math.cos(lat*r)*Math.cos(dec));if(Math.abs(c)>1)return null;const H=Math.acos(c)/r,nn=720-4*lng-eot;return[new Date(b+(nn-4*H)*6e4),new Date(b+(nn+4*H)*6e4)]}
const upc=()=>S.ev.filter(v=>new Date(v.d)>new Date()).sort((a,b)=>new Date(a.d)-new Date(b.d));

const catCard=c=>`<a class="card" href="#cat-${c.id}"><div class="ic">${e(c.icon)}</div><h3>${e(tr(c.t))}</h3><div class="sub">${e(tr(c.d))}</div></a>`;
const evCard=v=>`<a class="card" href="#ev-${v.id}">${v.img&&v.img.startsWith("data:image/")?`<img src="${v.img}" alt="">`:""}<h3>${e(tr(v.t))}</h3><div class="sub">${fd(v.d)}</div></a>`;
const labCard=p=>`<a class="card" href="#lab-${p.id}"><div class="ic">🧪</div><h3>${e(tr(p.t))}</h3></a>`;
const safeUrl=s=>/^https?:\/\//i.test(s||"")?s:"";

function nav(){return`<nav><a class="logo" href="#home">${e(S.site.logo||"ASTROVERSE")}</a><div class="lk"><a href="#home">${u("home")}</a><a href="#events">${u("events")}</a><a href="#lab">${u("lab")}</a><a href="#universe">${u("uni")}</a><a href="#moon">${u("mph")}</a>${S.pages.filter(p=>p.nav).map(p=>`<a href="#pg-${p.id}">${e(tr(p.t))}</a>`).join("")}<a href="#favs">♥</a><input id="q" placeholder="${u("srch")}" style="width:110px;padding:3px 8px">${auth?`<a href="#admin">${u("admin")}</a>`:""}${["ar","en","fr"].map(l=>`<button class="lb ${S.lang==l?"on":""}" data-a="lang:${l}">${l.toUpperCase()}</button>`).join("")}</div></nav>`}

function home(){return`<section class="hero"><div><div class="lbl">${u("clock")}</div><h1>${e(tr(S.site.title))}</h1><p class="sub">${e(tr(S.site.sub))}</p><div class="big" id="time"></div><div class="sub" id="date"></div><br><div class="lbl">${u("next")}: <span id="evn"></span></div><div class="cd" id="cd"></div></div><canvas id="sys" width="600" height="600"></canvas></section>
<section><div class="grid"><div class="card"><div class="lbl">${u("moon")}</div><div class="big" id="moon"></div><div class="sub" id="moonp"></div></div><div class="card"><div class="lbl">${u("rise")}</div><div class="big" id="sr"></div><div class="sub">${e(S.loc.name)}</div></div><div class="card"><div class="lbl">${u("set")}</div><div class="big" id="ss"></div><div class="sub">${S.loc.lat}, ${S.loc.lng}</div></div></div></section>
<section><h2>${u("explore")}</h2><div class="grid">${S.cats.filter(c=>c.show).map(catCard).join("")}</div></section>
<section><h2>${u("upcoming")}</h2><div class="grid">${upc().slice(0,6).map(evCard).join("")||`<p class="sub">${u("empty")}</p>`}</div></section>
<section><h2>${u("lab")}</h2><div class="grid">${S.lab.slice(0,3).map(labCard).join("")||`<p class="sub">${u("nolab")}</p>`}</div></section>`}

function catPage(id){const c=S.cats.find(x=>x.id==id);if(!c)return`<section><p>${u("empty")}</p></section>`;const L=S.ev.filter(v=>v.cat==id).sort((a,b)=>new Date(a.d)-new Date(b.d));return`<section><a class="chip" href="#home">← ${u("back")}</a><h1>${e(c.icon)} ${e(tr(c.t))} <button class="lb" data-a="fav:cat-${c.id}">${FV.includes("cat-"+c.id)?"♥":"♡"}</button></h1><p class="sub">${e(tr(c.d))}</p>${M3(c.m)}<div class="grid">${L.map(evCard).join("")||`<p class="sub">${u("empty")}</p>`}</div></section>`}
function evPage(id){const v=S.ev.find(x=>x.id==id);if(!v)return`<section><p>${u("empty")}</p></section>`;const c=S.cats.find(x=>x.id==v.cat);return`<section><a class="chip" href="#${c?"cat-"+c.id:"events"}">← ${u("back")}</a><h1>${e(tr(v.t))}</h1><p><button class="lb" data-a="fav:ev-${v.id}">${FV.includes("ev-"+v.id)?"♥":"♡"}</button> <span class="chip">${fd(v.d)}</span> ${c?`<a class="chip" href="#cat-${c.id}">${e(tr(c.t))}</a>`:""}</p>${v.img&&v.img.startsWith("data:image/")?`<img src="${v.img}" alt="" style="max-width:100%;border-radius:14px">`:""}<p class="pre">${e(tr(v.x))}</p>${M3(v.m)}</section>`}
function labPage(id){const p=S.lab.find(x=>x.id==id),s=p&&safeUrl(p.u);if(!p)return`<section><p>${u("empty")}</p></section>`;return`<section><a class="chip" href="#lab">← ${u("back")}</a><h1>${e(tr(p.t))}</h1>${s?`<p><a class="chip" href="${e(s)}" target="_blank" rel="noopener noreferrer">${u("open")} ↗</a></p><iframe src="${e(s)}" sandbox="allow-scripts allow-pointer-lock allow-fullscreen" referrerpolicy="no-referrer" loading="lazy"></iframe>`:`<p class="sub">${u("bad")}</p>`}</section>`}

const F=(p,ph,t)=>t?`<textarea data-p="${p}" placeholder="${ph}" rows="2">${e(get(p))}</textarea>`:`<input data-p="${p}" placeholder="${ph}" value="${e(get(p))}">`;
const T=(p,t)=>`<div class="g3">${["en","fr","ar"].map(l=>F(p+"."+l,l.toUpperCase(),t)).join("")}</div>`;
const mv=(k,i)=>`<button class="pb" data-a="up:${k}:${i}">↑</button><button class="pb" data-a="dn:${k}:${i}">↓</button><button class="pb dg" data-a="del:${k}:${i}">${u("del")}</button>`;

function adminPage(){
if(!auth)return`<section class="adm"><h2>${u("admin")}</h2><input id="pw" type="password" placeholder="${u("pass")}" style="max-width:260px"><button class="pb" data-a="login">${u("login")}</button><p class="sub">${msg}</p></section>`;
const tabs=[["site","site"],["cats","cats"],["ev","evs"],["lab","labs"],["pg","pgs"]];
let b="";
if(tab=="site")b=`<div class="card"><div class="lbl">${u("logo")}</div>${F("site.logo","Logo")}<div class="lbl">${u("foot")}</div>${T("site.foot")}<div class="lbl">${u("lt")}</div>${T("site.title")}<div class="lbl">${u("ls")}</div>${T("site.sub","t")}<div class="lbl">${u("accent")}</div><input type="color" data-p="site.accent" value="${e(S.site.accent)}" style="width:80px"></div>
<div class="card"><div class="lbl">${u("loc")}</div><div class="g3">${F("loc.name","Name")}${F("loc.lat","Lat")}${F("loc.lng","Lng")}</div><div class="lbl">${u("pass")}</div><input id="npw" type="password" placeholder="min 8" autocomplete="new-password"><button class="pb" data-a="pw">OK</button></div>
<div class="card"><textarea id="io" rows="5">${e(JSON.stringify(S))}</textarea><button class="pb" data-a="imp">${u("imp")}</button><button class="pb dg" data-a="reset">${u("reset")}</button></div>`;

const T3=THREE,w=el.clientWidth||600,h=el.clientHeight||420,R=new T3.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.setSize(w,h);el.appendChild(R.domElement);

const d=PD[hit.object.userData.i],py=d[7]>700?(d[7]/365).toFixed(1)+" "+u("yr"):d[7]+" "+u("dy");pn.style.display="block";pn.innerHTML="";const b1=document.createElement("b");b1.textContent=d[{en:0,fr:1,ar:2}[S.lang]];pn.append(b1);
[[u("dia"),d[5].toLocaleString(S.lang)+" km"],[u("dst"),d[6]+" AU"],[u("per"),py]].forEach(r=>{const q=document.createElement("div");q.textContent=r[0]+": "+r[1];pn.append(q)})}
